<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RecipeTune | Turn a recipe screenshot into something you can cook</title>
  <meta name="description" content="RecipeTune organizes recipe photos — Japanese included — into clean ingredients and steps, then adapts them to your servings, units, and kitchen. iOS &amp; Android." />
  <link rel="canonical" href="https://recipetune.koczancraft.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Koczan Craft" />
  <meta property="og:title" content="RecipeTune | Turn a recipe screenshot into something you can cook" />
  <meta property="og:description" content="Reads your recipe photos in English or Japanese, organizes them into ingredients and steps, then scales them to your servings and units." />
  <meta property="og:url" content="https://recipetune.koczancraft.com/" />
  <meta property="og:image" content="https://recipetune.koczancraft.com/icon.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />
  <meta property="og:image:alt" content="RecipeTune" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="RecipeTune | Turn a recipe screenshot into something you can cook" />
  <meta name="twitter:description" content="Reads your recipe photos in English or Japanese, organizes them into ingredients and steps, then scales them to your servings and units." />
  <meta name="twitter:image" content="https://recipetune.koczancraft.com/icon.png" />

  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #1A1A1A;
      --muted: #6B6B6B;
      --faint: #9A9A9A;
      --line: #EDEDED;
      --surface: #F6F6F4;
      --coral: #F0674A;
      --coral-dark: #D8543A;
      --coral-tint: #FCEBE7;
      --coral-deep: #8A3D2B;
      --wrap: 1120px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--coral-tint); color: var(--ink); }
    a { color: var(--coral-dark); text-decoration: none; }
    img { max-width: 100%; }
    h1, h2 { text-wrap: balance; }
    p { text-wrap: pretty; }
    .wrap { max-width: var(--wrap); margin: 0 auto; padding-left: 32px; padding-right: 32px; }

    /* ---- topbar ---- */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar .wrap {
      padding-top: 14px; padding-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 32px; height: 32px; border-radius: 9px; display: block; }
    .brand span { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
    .topbar-right { display: flex; align-items: center; gap: 28px; }
    nav.links { display: flex; gap: 24px; font-size: 14.5px; font-weight: 500; }
    nav.links a { color: var(--muted); }
    nav.links a:hover { color: var(--ink); }

    .langs {
      display: flex; border: 1px solid var(--line); border-radius: 999px;
      padding: 3px; gap: 2px; background: var(--surface);
    }
    .langs button {
      border: none; border-radius: 999px; padding: 7px 14px;
      font-family: inherit; font-weight: 600; font-size: 13px; line-height: 1;
      cursor: pointer; background: transparent; color: var(--faint);
    }
    .langs button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(26,26,26,.10); }

    /* ---- buttons ---- */
    .btn-primary {
      background: var(--coral); color: #fff; font-weight: 600; font-size: 16px;
      padding: 16px 30px; border-radius: 999px; display: inline-block;
    }
    .btn-primary:hover { background: var(--coral-dark); color: #fff; }
    .btn-ghost {
      color: var(--ink); font-weight: 600; font-size: 16px;
      padding: 16px 26px; border-radius: 999px; border: 1px solid var(--line); display: inline-block;
    }
    .btn-ghost:hover { background: var(--surface); color: var(--ink); }

    /* ---- hero ---- */
    .hero { padding-top: 88px; padding-bottom: 96px; display: grid; grid-template-columns: 1fr 380px; gap: 64px; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 9px;
      background: var(--coral-tint); color: var(--coral-dark);
      font-weight: 600; font-size: 13px; padding: 8px 15px; border-radius: 999px; margin-bottom: 28px;
    }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); display: block; }
    .hero h1 { font-size: 56px; line-height: 1.08; letter-spacing: -.028em; font-weight: 700; margin: 0 0 24px; }
    .hero .sub { font-size: 19px; line-height: 1.65; color: var(--muted); margin: 0 0 40px; max-width: 540px; }
    .hero-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .hero-note { margin-top: 28px; font-size: 14px; color: var(--faint); }

    /* ---- phone mockups ---- */
    .phone {
      justify-self: center; width: 340px; max-width: 100%;
      border-radius: 34px; background: #fff; border: 1px solid var(--line);
      box-shadow: 0 30px 60px -30px rgba(26,26,26,.28), 0 4px 16px -6px rgba(26,26,26,.06);
      padding: 14px;
    }
    .phone-inner { border-radius: 24px; background: var(--surface); padding: 20px 18px 22px; }
    .mock-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .mock-head .t { font-weight: 600; font-size: 15px; }
    .pill-flag { font-size: 12px; font-weight: 600; color: var(--coral-dark); background: var(--coral-tint); padding: 5px 10px; border-radius: 999px; }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: #fff; border-radius: 12px; padding: 13px 14px; font-size: 14.5px;
    }
    .row .amt { color: var(--muted); }
    .row.flagged { display: block; border: 1.5px solid var(--coral); }
    .row.flagged .line { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; }
    .row.flagged .amt { color: var(--ink); font-weight: 600; }
    .row .hint { font-size: 12.5px; color: var(--coral-dark); margin-top: 7px; }
    .row .scaled { font-weight: 600; white-space: nowrap; }
    .mock-actions { display: flex; gap: 8px; margin-top: 18px; }
    .mock-actions div { flex: 1; text-align: center; border-radius: 999px; padding: 12px; font-size: 14px; font-weight: 600; }
    .mock-actions .discard { background: #fff; color: var(--muted); }
    .mock-actions .save { background: var(--coral); color: #fff; }

    /* ---- sections ---- */
    .band { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .kicker { font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--coral-dark); margin-bottom: 16px; }
    .split { padding-top: 96px; padding-bottom: 96px; display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; }
    .split h2 { font-size: 40px; line-height: 1.14; letter-spacing: -.024em; font-weight: 700; margin: 0 0 20px; }
    .split .body { font-size: 17.5px; line-height: 1.7; color: var(--muted); margin: 0; }

    .stack { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
    .card {
      background: #fff; border-radius: 18px; padding: 24px 26px;
      box-shadow: 0 10px 24px -18px rgba(26,26,26,.35);
    }
    .card .t { font-weight: 600; font-size: 16.5px; margin-bottom: 7px; }
    .card .d { font-size: 15px; line-height: 1.6; color: var(--muted); }

    /* ---- adapt ---- */
    .adapt { padding-top: 104px; padding-bottom: 104px; display: grid; grid-template-columns: 380px 1fr; gap: 72px; align-items: center; }
    .adapt h2 { font-size: 40px; line-height: 1.14; letter-spacing: -.024em; font-weight: 700; margin: 0 0 20px; }
    .adapt .body { font-size: 17.5px; line-height: 1.7; color: var(--muted); margin: 0 0 32px; max-width: 520px; }
    .adapt .points { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; }
    .adapt .points .card { border: 1px solid var(--line); box-shadow: none; padding: 20px 22px; }
    .adapt .points .card .t { font-size: 15.5px; margin-bottom: 6px; }
    .adapt .points .card .d { font-size: 14.5px; }

    .scale-recipe { font-weight: 600; font-size: 16px; margin-bottom: 16px; }
    .stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .stepper-row .lbl { font-size: 14.5px; color: var(--muted); }
    .stepper { display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 999px; padding: 4px; }
    .stepper button {
      width: 28px; height: 28px; border-radius: 999px; border: none; background: var(--surface);
      color: var(--ink); font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1; cursor: pointer;
    }
    .stepper button:hover:not(:disabled) { background: var(--coral-tint); color: var(--coral-dark); }
    .stepper button:disabled { opacity: .35; cursor: default; }
    .stepper .val { min-width: 78px; text-align: center; font-weight: 600; font-size: 14.5px; }
    .scale-note { margin-top: 14px; background: var(--coral-tint); border-radius: 14px; padding: 13px 15px; font-size: 13px; line-height: 1.55; color: var(--coral-deep); }

    /* ---- feature grid ---- */
    .grid-sec { padding-top: 96px; padding-bottom: 96px; }
    .grid-sec h2 { font-size: 34px; line-height: 1.16; letter-spacing: -.022em; font-weight: 700; margin: 0 0 12px; }
    .grid-sec .lead { font-size: 17px; color: var(--muted); margin: 0 0 48px; max-width: 560px; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .features .card { border-radius: 20px; padding: 28px 26px 30px; }
    .features .mark {
      width: 38px; height: 38px; border-radius: 11px; background: var(--coral-tint);
      display: grid; place-items: center; margin-bottom: 20px;
      font-weight: 700; font-size: 14px; color: var(--coral-dark);
    }
    .features .card .t { font-size: 17px; margin-bottom: 8px; }
    .features .card .d { font-size: 15px; line-height: 1.65; }

    /* ---- why ---- */
    .why { padding-top: 88px; padding-bottom: 88px; border-bottom: 1px solid var(--line); }
    .why h2 { font-size: 34px; line-height: 1.16; letter-spacing: -.022em; font-weight: 700; margin: 0 0 44px; }
    .whys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px; }
    .whys .rule { width: 34px; height: 3px; border-radius: 999px; background: var(--coral); margin-bottom: 18px; }
    .whys .t { font-weight: 600; font-size: 18px; margin-bottom: 10px; }
    .whys .d { font-size: 15.5px; line-height: 1.7; color: var(--muted); }

    /* ---- CTA ---- */
    .cta { padding-top: 104px; padding-bottom: 104px; text-align: center; }
    .cta img { width: 72px; height: 72px; border-radius: 20px; display: block; margin: 0 auto 28px; }
    .cta h2 { font-size: 38px; line-height: 1.14; letter-spacing: -.024em; font-weight: 700; margin: 0 0 14px; }
    .cta .lead { font-size: 17.5px; line-height: 1.65; color: var(--muted); margin: 0 auto 36px; max-width: 480px; }
    .notify { display: flex; gap: 10px; max-width: 460px; margin: 0 auto; }
    .notify input {
      flex: 1; min-width: 0; font-family: inherit; font-size: 16px; padding: 15px 20px;
      border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: none;
    }
    .notify input:focus { border-color: var(--coral); background: #fff; }
    .notify button {
      background: var(--coral); color: #fff; border: none; font-family: inherit;
      font-weight: 600; font-size: 16px; padding: 15px 28px; border-radius: 999px; cursor: pointer;
    }
    .notify button:hover:not(:disabled) { background: var(--coral-dark); }
    .notify button:disabled { opacity: .6; cursor: default; }
    .status { font-size: 13.5px; color: var(--faint); margin-top: 18px; }
    .status.ok { color: var(--coral-dark); }
    .status.err { color: #B4392B; }

    /* ---- footer ---- */
    footer { border-top: 1px solid var(--line); }
    footer .wrap {
      padding-top: 34px; padding-bottom: 34px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; font-size: 14px; color: var(--faint); flex-wrap: wrap;
    }
    footer nav { display: flex; gap: 24px; flex-wrap: wrap; }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--ink); }

    /* ---- responsive ---- */
    @media (max-width: 980px) {
      .hero, .split, .adapt { grid-template-columns: 1fr; gap: 56px; }
      .adapt .phone { grid-row: 2; }
      .features { grid-template-columns: repeat(2, 1fr); }
      .whys { grid-template-columns: repeat(2, 1fr); gap: 32px; }
      .hero h1 { font-size: 44px; }
      .split h2, .adapt h2 { font-size: 34px; }
    }
    @media (max-width: 680px) {
      .wrap { padding-left: 20px; padding-right: 20px; }
      nav.links { display: none; }
      .topbar-right { gap: 0; }
      .hero { padding-top: 56px; padding-bottom: 64px; }
      .hero h1 { font-size: 34px; }
      .hero .sub { font-size: 17px; margin-bottom: 32px; }
      .hero-actions { gap: 12px; }
      .btn-primary, .btn-ghost { padding: 14px 24px; font-size: 15px; }
      .split, .grid-sec { padding-top: 64px; padding-bottom: 64px; }
      .adapt, .cta { padding-top: 72px; padding-bottom: 72px; }
      .why { padding-top: 64px; padding-bottom: 64px; }
      .features, .adapt .points, .whys { grid-template-columns: 1fr; }
      .split h2, .adapt h2, .cta h2 { font-size: 28px; }
      .grid-sec h2, .why h2 { font-size: 26px; }
      .notify { flex-direction: column; border-radius: 20px; }
      .notify input, .notify button { width: 100%; }
      footer .wrap { flex-direction: column; align-items: flex-start; gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="wrap">
      <div class="brand">
        <img src="icon.png" alt="RecipeTune" width="32" height="32" />
        <span>RecipeTune</span>
      </div>
      <div class="topbar-right">
        <nav class="links">
          <a href="#import" data-i18n="nav.import"></a>
          <a href="#adapt" data-i18n="nav.adapt"></a>
          <a href="#features" data-i18n="nav.features"></a>
          <a href="#why" data-i18n="nav.why"></a>
        </nav>
        <div class="langs">
          <button type="button" data-setlang="en">EN</button>
          <button type="button" data-setlang="ja">日本語</button>
        </div>
      </div>
    </div>
  </div>

  <section class="wrap hero">
    <div>
      <div class="badge"><span class="dot"></span><span data-i18n="hero.badge"></span></div>
      <h1 data-i18n="hero.title"></h1>
      <p class="sub" data-i18n="hero.sub"></p>
      <div class="hero-actions">
        <a class="btn-primary" href="#notify" data-i18n="hero.cta"></a>
        <a class="btn-ghost" href="#import" data-i18n="hero.cta2"></a>
      </div>
      <div class="hero-note" data-i18n="hero.note"></div>
    </div>

    <div class="phone">
      <div class="phone-inner">
        <div class="mock-head">
          <span class="t" data-i18n="mock.title"></span>
          <span class="pill-flag" data-i18n="mock.flagged"></span>
        </div>
        <div class="rows">
          <div class="row"><span data-i18n="mock.r1n"></span><span class="amt" data-i18n="mock.r1a"></span></div>
          <div class="row"><span data-i18n="mock.r2n"></span><span class="amt" data-i18n="mock.r2a"></span></div>
          <div class="row flagged">
            <div class="line"><span data-i18n="mock.r3n"></span><span class="amt" data-i18n="mock.r3a"></span></div>
            <div class="hint" data-i18n="mock.hint"></div>
          </div>
          <div class="row"><span data-i18n="mock.r4n"></span><span class="amt" data-i18n="mock.r4a"></span></div>
        </div>
        <div class="mock-actions">
          <div class="discard" data-i18n="mock.discard"></div>
          <div class="save" data-i18n="mock.save"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="band" id="import">
    <section class="wrap split">
      <div>
        <div class="kicker" data-i18n="flag.kicker"></div>
        <h2 data-i18n="flag.title"></h2>
        <p class="body" data-i18n="flag.body"></p>
      </div>
      <div class="stack" id="flagPoints"></div>
    </section>
  </div>

  <section class="wrap adapt" id="adapt">
    <div class="phone">
      <div class="phone-inner">
        <div class="scale-recipe" data-i18n="scale.recipe"></div>
        <div class="stepper-row">
          <span class="lbl" data-i18n="scale.servings"></span>
          <div class="stepper">
            <button type="button" id="dec" aria-label="Fewer servings">−</button>
            <span class="val" id="servingsLabel"></span>
            <button type="button" id="inc" aria-label="More servings">+</button>
          </div>
        </div>
        <div class="rows" id="scaledRows"></div>
        <div class="scale-note" id="scaleNote"></div>
      </div>
    </div>

    <div>
      <div class="kicker" data-i18n="scale.kicker"></div>
      <h2 data-i18n="scale.title"></h2>
      <p class="body" data-i18n="scale.body"></p>
      <div class="points" id="scalePoints"></div>
    </div>
  </section>

  <div class="band" id="features">
    <section class="wrap grid-sec">
      <h2 data-i18n="grid.title"></h2>
      <p class="lead" data-i18n="grid.sub"></p>
      <div class="features" id="featureGrid"></div>
    </section>
  </div>

  <section class="wrap why" id="why">
    <h2 data-i18n="why.title"></h2>
    <div class="whys" id="whyGrid"></div>
  </section>

  <section class="wrap cta" id="notify">
    <img src="icon.png" alt="" width="72" height="72" />
    <h2 data-i18n="cta.title"></h2>
    <p class="lead" data-i18n="cta.sub"></p>
    <form class="notify" id="notifyForm">
      <input type="email" name="email" required autocomplete="email" id="notifyEmail" />
      <button type="submit" data-i18n="cta.button"></button>
    </form>
    <div class="status" id="notifyStatus"></div>
  </section>

  <footer>
    <div class="wrap">
      <span>© 2026 Koczan Craft</span>
      <nav>
        <a href="https://www.koczancraft.com">koczancraft.com</a>
        <a href="https://apps.koczancraft.com" data-i18n="footer.apps"></a>
        <a href="mailto:hello@koczancraft.com" data-i18n="footer.contact"></a>
      </nav>
    </div>
  </footer>

    // Repeated blocks + anything computed (scaling, form status) lives here rather than in

          { mark: "あ", title: "Bilingual all the way down", body: "Every screen in English and 日本語 — not a translated menu over an English app." },

        ],

        ],

          { title: "正直な作りに", body: "黙って自動保存せず、確認のステップを挟みます。何が確実で、何が不確実だったのかが、いつでも分かります。" },
          { title: "元を書き換えない分量調整", body: "人数を変えれば、読みやすい分数で新しい分量が表示されます。保存したレシピが勝手に書き換わることはありません。" },
          { title: "フィードではなく、レシピ箱", body: "発見機能もアルゴリズムもありません。手持ちのレシピのための、静かな場所です。" }

    var MIN_SERVINGS = 1, MAX_SERVINGS = 12, BASE_SERVINGS = 2;
    var servings = 4;
    var currentLang = "en";
    var sent = false;

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    // Amounts scale linearly (amount * target / base) and are never rounded — the display
    // just writes the exact value as a cooking fraction, which is what the app does.
    var FRACTIONS = [
      [1 / 8, "⅛"], [1 / 4, "¼"], [1 / 3, "⅓"], [3 / 8, "⅜"], [1 / 2, "½"],
      [5 / 8, "⅝"], [2 / 3, "⅔"], [3 / 4, "¾"], [7 / 8, "⅞"]
    ];
    function frac(v) {
      var whole = Math.floor(v + 1e-9);
      var rest = v - whole;
      if (rest < 1e-9) return String(whole);
      for (var i = 0; i < FRACTIONS.length; i++) {
        if (Math.abs(rest - FRACTIONS[i][0]) < 1e-9) {
          return (whole ? whole : "") + FRACTIONS[i][1];
        }
      }
      return String(Math.round(v * 100) / 100);
    }
    function grams(v) {
      return v >= 1000
        ? String(Math.round(v / 10) / 100).replace(/\.?0+$/, "") + " kg"
        : frac(v) + " g";
    }

    function scaledRows() {
      var f = servings / BASE_SERVINGS;
      if (currentLang === "ja") {
        return [
          { name: "きゅうり", now: frac(2 * f) + "本" },
          { name: "塩", now: "小さじ" + frac(0.5 * f) },
          { name: "☆しょうゆ", now: "大さじ" + frac(1 * f) },
          { name: "☆ごま油", now: "小さじ" + frac(2 * f) },
          { name: "こしょう", now: "適量", flat: true }
        ];
      }
      return [
        { name: "Chicken breast, cubed", now: grams(300 * f) },
        { name: "Soy sauce", now: frac(1 * f) + " tbsp" },
        { name: "Garlic powder", now: frac(1 * f) + " tbsp" },
        { name: "Rice noodles, uncooked", now: grams(100 * f) },
        { name: "Black pepper", now: "to taste", flat: true }
      ];
    }

    function renderScaling() {
      var c = CONTENT[currentLang];
      document.getElementById("servingsLabel").textContent = c.servingsUnit(servings);
      document.getElementById("scaledRows").innerHTML = scaledRows().map(function (r) {
        var cls = r.flat ? "amt" : "scaled";
        return '<div class="row"><span>' + esc(r.name) + '</span><span class="' + cls + '">' + esc(r.now) + "</span></div>";
      }).join("");
      document.getElementById("scaleNote").textContent = servings > 4 ? c.noteBig(servings) : c.noteSmall;
      document.getElementById("dec").disabled = servings <= MIN_SERVINGS;
      document.getElementById("inc").disabled = servings >= MAX_SERVINGS;
    }

    function renderLists() {
      var c = CONTENT[currentLang];
      function cards(list) {
        return list.map(function (p) {
          return '<div class="card"><div class="t">' + esc(p.title) + '</div><div class="d">' + esc(p.body) + "</div></div>";
        }).join("");
      }
      document.getElementById("flagPoints").innerHTML = cards(c.flagPoints);
      document.getElementById("scalePoints").innerHTML = cards(c.scalePoints);
      document.getElementById("featureGrid").innerHTML = c.features.map(function (f) {
        return '<div class="card"><div class="mark">' + esc(f.mark) + '</div><div class="t">' + esc(f.title) + '</div><div class="d">' + esc(f.body) + "</div></div>";
      }).join("");
      document.getElementById("whyGrid").innerHTML = c.whys.map(function (w) {
        return '<div><div class="rule"></div><div class="t">' + esc(w.title) + '</div><div class="d">' + esc(w.body) + "</div></div>";
      }).join("");
    }

    function applyLang(lang) {
      currentLang = I18N[lang] ? lang : "en";
      var dict = I18N[currentLang];
      var c = CONTENT[currentLang];
      document.documentElement.lang = currentLang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (dict[key] != null) el.innerHTML = dict[key];
      });
      document.querySelectorAll("[data-setlang]").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-setlang") === currentLang);
      });
      document.getElementById("notifyEmail").placeholder = c.emailPlaceholder;
      if (!sent) setStatus(c.statusIdle, "");
      renderLists();
      renderScaling();
      try { localStorage.setItem("lang", currentLang); } catch (e) {}
    }

    function setStatus(msg, cls) {
      var el = document.getElementById("notifyStatus");
      el.textContent = msg;
      el.className = "status " + cls;
    }

    // /en and /jp are shareable, language-pinned URLs (see vercel.json rewrites).
    function pathForLang(lang) { return lang === "ja" ? "/jp" : "/en"; }
    function langFromPath() {
      var path = window.location.pathname.replace(/\/+$/, "");
      if (path === "/en") return "en";
      if (path === "/jp") return "ja";
      return null;
    }

    document.querySelectorAll("[data-setlang]").forEach(function (b) {
      b.addEventListener("click", function () {
        var lang = b.getAttribute("data-setlang");
        applyLang(lang);
        var target = pathForLang(lang);
        if (window.location.pathname.replace(/\/+$/, "") !== target) {
          history.pushState({ lang: lang }, "", target);
        }
      });
    });
    window.addEventListener("popstate", function () {
      applyLang(langFromPath() || detectLang());
    });

    document.getElementById("inc").addEventListener("click", function () {
      servings = Math.min(MAX_SERVINGS, servings + 1);
      renderScaling();
    });
    document.getElementById("dec").addEventListener("click", function () {
      servings = Math.max(MIN_SERVINGS, servings - 1);
      renderScaling();
    });

    document.getElementById("notifyForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var c = CONTENT[currentLang];
      var form = e.target;
      var btn = form.querySelector("button");
      btn.disabled = true;
      setStatus(c.statusSending, "");
      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          access_key: WEB3FORMS_KEY,
          subject: "[RecipeTune] Launch notify signup",
          from_name: "RecipeTune site",
          email: form.email.value,
          message: "Launch notification signup (" + currentLang + ")"
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.success) {
            sent = true;
            setStatus(c.statusSent, "ok");
            form.reset();
          } else {
            setStatus(c.statusError, "err");
          }
        })
        .catch(function () { setStatus(c.statusError, "err"); })
        .finally(function () { btn.disabled = false; });
    });

    // initial language: URL path (/en, /jp) → saved → browser → en
    function detectLang() {
      var saved;
      try { saved = localStorage.getItem("lang"); } catch (e) {}
      return saved || ((navigator.language || "en").toLowerCase().indexOf("ja") === 0 ? "ja" : "en");
    }
    applyLang(langFromPath() || detectLang());
  </script>
