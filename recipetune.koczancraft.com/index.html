<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RecipeTune: screenshot a recipe, cook it for anyone</title>
  <meta name="description" content="RecipeTune turns a screenshot or photo of any recipe into a clean recipe you can cook from, sized for however many people are eating. Coming soon to the App Store." />
  <meta property="og:title" content="RecipeTune" />
  <meta property="og:description" content="Screenshot a recipe, cook it for anyone. Servings, units, timers and a shopping list, in English and Japanese." />
  <meta property="og:image" content="https://recipetune.koczancraft.com/assets/store/en/03.jpg" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --bg-subtle: #F6F6F4;
      --ink: #1A1A1A;
      --ink-2: #6B6B6B;
      --line: #EDEDED;
      --accent: #F0674A;
      --accent-tint: #FCEBE7;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.10);
      --radius-lg: 20px;
      --radius-xl: 24px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", "Noto Sans JP", system-ui, -apple-system, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    html[lang="ja"] body { font-family: "Noto Sans JP", "Inter", system-ui, sans-serif; }
    a { color: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    section { scroll-margin-top: 80px; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: saturate(160%) blur(12px);
      -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    header .wrap { display: flex; align-items: center; gap: 24px; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; }
    .brand img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    header nav { display: flex; gap: 20px; margin-left: auto; font-size: 15px; color: var(--ink-2); }
    header nav a { text-decoration: none; }
    header nav a:hover { color: var(--ink); }
    .lang { display: flex; background: var(--bg-subtle); border-radius: 999px; padding: 3px; }
    .lang button {
      border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500;
      color: var(--ink-2); padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .lang button[aria-pressed="true"] { background: var(--bg); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.06); }

    /* Hero */
    .hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center; padding: 72px 20px 56px; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;
      color: var(--accent); background: var(--accent-tint); padding: 6px 14px; border-radius: 999px;
    }
    .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    h1 { font-size: 52px; line-height: 1.1; letter-spacing: -0.02em; margin: 20px 0 16px; white-space: pre-line; }
    html[lang="ja"] h1 { font-size: 44px; letter-spacing: 0; line-height: 1.25; }
    .sub { font-size: 20px; color: var(--ink-2); margin: 0 0 28px; max-width: 34em; }
    .store {
      display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px;
      background: var(--ink); color: #fff; font-weight: 600; font-size: 16px; text-decoration: none;
    }
    .store svg { width: 22px; height: 22px; fill: #fff; }
    .note { font-size: 14px; color: var(--ink-2); margin-top: 14px; }
    .phone {
      width: 100%; max-width: 300px; border-radius: 44px; padding: 10px; background: #111;
      box-shadow: var(--shadow); margin: 0 auto;
    }
    .phone img { display: block; width: 100%; height: auto; border-radius: 34px; background: var(--bg-subtle); }

    /* Gallery: the App Store images, swiped sideways */
    .gallery { background: var(--bg-subtle); padding: 56px 0 48px; }
    .gallery h2 { text-align: center; }
    .strip {
      display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory;
      padding: 12px max(20px, calc((100vw - 1080px) / 2 + 20px)) 28px;
      scrollbar-width: thin;
    }
    .strip figure { flex: 0 0 auto; width: 276px; margin: 0; scroll-snap-align: center; }
    .strip img {
      display: block; width: 100%; height: auto; border-radius: var(--radius-xl);
      box-shadow: 0 6px 20px rgba(0,0,0,.06); background: var(--bg);
    }
    .hint { text-align: center; font-size: 14px; color: var(--ink-2); margin: 0; }

    /* Features */
    .features { padding: 72px 20px; }
    h2 { font-size: 36px; line-height: 1.2; letter-spacing: -0.01em; margin: 10px 0 16px; }
    html[lang="ja"] h2 { font-size: 30px; letter-spacing: 0; line-height: 1.35; }
    .kicker { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
    html[lang="ja"] .kicker { letter-spacing: .02em; }
    .center { text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 32px; }
    .grid.four { grid-template-columns: repeat(4, 1fr); }
    .card { background: var(--bg-subtle); border-radius: var(--radius-lg); padding: 24px; }
    .card b { display: block; margin-bottom: 6px; font-size: 18px; }
    .card span { color: var(--ink-2); font-size: 15px; }
    .details { padding: 0 20px 72px; }
    .details .card { background: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.04); border: 1px solid var(--line); }

    /* Pricing */
    .pricing { padding: 72px 20px; text-align: center; background: var(--bg-subtle); }
    .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 760px; margin: 36px auto 0; text-align: left; }
    .plan { border-radius: var(--radius-xl); padding: 28px; background: var(--bg); }
    .plan.premium { box-shadow: var(--shadow); }
    .plan h3 { margin: 0 0 4px; font-size: 22px; }
    .price { font-size: 15px; color: var(--ink-2); margin-bottom: 16px; }
    .plan ul { margin: 0; padding-left: 20px; color: var(--ink-2); }
    .plan li { margin-bottom: 6px; }
    .plan.premium h3 { color: var(--accent); }

    /* CTA + footer */
    .cta { text-align: center; padding: 72px 20px 88px; }
    .cta img { width: 88px; height: 88px; border-radius: 20px; box-shadow: var(--shadow); }
    footer { border-top: 1px solid var(--line); padding: 28px 20px; font-size: 14px; color: var(--ink-2); }
    footer .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    footer nav { margin-left: auto; display: flex; gap: 20px; }

    @media (max-width: 860px) {
      header nav { display: none; }
      .lang { margin-left: auto; }
      .hero { grid-template-columns: 1fr; gap: 36px; padding-top: 48px; padding-bottom: 48px; }
      h1 { font-size: 38px; }
      html[lang="ja"] h1 { font-size: 32px; }
      h2 { font-size: 28px; }
      html[lang="ja"] h2 { font-size: 24px; }
      .grid, .grid.four { grid-template-columns: 1fr 1fr; }
      .plans { grid-template-columns: 1fr; }
      .strip figure { width: 232px; }
    }
    @media (max-width: 520px) { .grid, .grid.four { grid-template-columns: 1fr; } }
  </style>
</head>

      var hero = document.getElementById("heroShot");
      hero.src = "assets/screens/" + lang + "/01_library.jpg";
      hero.alt = lang === "ja" ? "レシピチューンのレシピ一覧" : "The recipe list in RecipeTune";
      var strip = document.getElementById("strip");
      strip.innerHTML = "";
      SHOTS[lang].forEach(function (s) {
        var fig = document.createElement("figure");
        var img = document.createElement("img");
        img.src = "assets/store/" + lang + "/" + s[0] + ".jpg";
        img.alt = s[1];
        img.width = 552; img.height = 1200;
        img.loading = "lazy";
        fig.appendChild(img);
        strip.appendChild(fig);
      });
      document.querySelectorAll(".lang button").forEach(function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
      });
      document.title = lang === "ja"
        ? "レシピチューン：スクショから、人数に合わせて料理"
        : "RecipeTune: screenshot a recipe, cook it for anyone";
      try { localStorage.setItem("rt-lang", lang); } catch (e) {}
    }

    function initial() {
      if (location.pathname.indexOf("/jp") === 0) return "ja";
      if (location.pathname.indexOf("/en") === 0) return "en";
      try { var s = localStorage.getItem("rt-lang"); if (s === "en" || s === "ja") return s; } catch (e) {}
      return (navigator.language || "").toLowerCase().indexOf("ja") === 0 ? "ja" : "en";
    }

    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { apply(b.getAttribute("data-lang")); });
    });
    apply(initial());
  </script>
</body>
</html>
