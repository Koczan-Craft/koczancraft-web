<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RecipeTune: your recipes, ready to cook</title>
  <meta name="description" content="RecipeTune turns a screenshot or photo of any recipe into a clean recipe you can cook from, sized for however many people are eating. Coming soon to the App Store." />
  <meta property="og:title" content="RecipeTune" />
  <meta property="og:description" content="Your recipes, ready to cook. Scan screenshots, cook for any number of people, in the units you use." />
  <meta property="og:image" content="https://recipetune.koczancraft.com/assets/dishes/spaghetti-bolognese.jpg" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --warm: #FBF8F5;
      --subtle: #F6F6F4;
      --ink: #1A1A1A;
      --ink-2: #6B6B6B;
      --line: #EDEDED;
      --accent: #F0674A;
      --accent-tint: #FCEBE7;
      --dark: #121212;
      --dark-2: #1E1E1E;
      --shadow-lg: 0 30px 60px -20px rgba(40, 20, 10, 0.25), 0 12px 32px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.10);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Inter", "Noto Sans JP", system-ui, -apple-system, sans-serif;
      font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    html[lang="ja"] body { font-family: "Noto Sans JP", "Inter", system-ui, sans-serif; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    em { font-style: normal; color: var(--accent); }
    .wrap { max-width: 1140px; margin: 0 auto; padding: 0 24px; }
    section { scroll-margin-top: 80px; position: relative; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.82);
      backdrop-filter: saturate(170%) blur(14px); -webkit-backdrop-filter: saturate(170%) blur(14px);
      border-bottom: 1px solid rgba(0,0,0,.05);
    }
    header .wrap { display: flex; align-items: center; gap: 28px; height: 68px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; text-decoration: none; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    header nav { display: flex; gap: 26px; margin-left: auto; font-size: 15px; color: var(--ink-2); }
    header nav a { text-decoration: none; transition: color .2s; }
    header nav a:hover { color: var(--ink); }
    .lang { display: flex; background: var(--subtle); border-radius: 999px; padding: 3px; }
    .lang button { border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: var(--ink-2); padding: 6px 13px; border-radius: 999px; cursor: pointer; }
    .lang button[aria-pressed="true"] { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.07); }

    /* Shared bits */
    .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--accent); background: var(--accent-tint); padding: 7px 15px; border-radius: 999px; }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    html[lang="ja"] .kicker { letter-spacing: .04em; }
    h1, h2 { letter-spacing: -0.025em; margin: 0; }
    html[lang="ja"] h1, html[lang="ja"] h2 { letter-spacing: 0; }
    .store { display: inline-flex; align-items: center; gap: 12px; padding: 15px 26px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; font-size: 16px; box-shadow: 0 10px 24px rgba(0,0,0,.18); }
    .store svg { width: 22px; height: 22px; fill: #fff; }
    .note { font-size: 14px; color: var(--ink-2); margin-top: 14px; }

    .phone { position: relative; width: 280px; border-radius: 50px; padding: 11px; background: linear-gradient(145deg, #2a2a2a, #0c0c0c); box-shadow: var(--shadow-lg); }
    .phone::after { content: ""; position: absolute; inset: 0; border-radius: 50px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.08); pointer-events: none; }
    .phone img { width: 100%; height: auto; border-radius: 40px; background: var(--subtle); }
    .dish { position: absolute; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow-lg); background: var(--subtle); }
    .dish img { width: 100%; height: 100%; object-fit: cover; }

    /* Hero */
    .hero { background: radial-gradient(1200px 600px at 85% 20%, #FDEDE7 0%, rgba(253,237,231,0) 60%), var(--warm); overflow: hidden; }
    .hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; min-height: 720px; padding-top: 40px; padding-bottom: 40px; }
    .hero h1 { font-size: 72px; line-height: 1.02; font-weight: 800; margin: 24px 0 22px; white-space: pre-line; }
    html[lang="ja"] .hero h1 { font-size: 56px; line-height: 1.2; font-weight: 900; }
    .hero .sub { font-size: 20px; color: var(--ink-2); margin: 0 0 34px; max-width: 30em; }
    /* Dishes sit behind the phone and peek out: the app is never covered. */
    .hero-visual { position: relative; height: 740px; }
    .hero-visual .phone { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(2deg); z-index: 3; width: 290px; }
    .hero-visual .d1 { width: 260px; height: 260px; left: -4%; top: 70px; transform: rotate(-8deg); z-index: 1; }
    .hero-visual .d2 { width: 250px; height: 250px; right: -6%; bottom: 70px; transform: rotate(7deg); z-index: 1; }

    /* Dish marquee */
    .marquee { overflow: hidden; background: var(--warm); padding: 8px 0 72px; }
    .marquee .track { display: flex; gap: 20px; width: max-content; animation: slide 60s linear infinite; }
    .marquee img { width: 220px; height: 160px; object-fit: cover; border-radius: 22px; box-shadow: 0 8px 24px rgba(40,20,10,.10); }
    @keyframes slide { to { transform: translateX(-50%); } }

    /* Feature rows */
    .features { padding: 40px 0 20px; }
    .feature { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; padding: 90px 24px; }
    .feature.flip .copy { order: 2; }
    .feature h2 { font-size: 52px; line-height: 1.06; font-weight: 800; margin: 14px 0 20px; white-space: pre-line; }
    html[lang="ja"] .feature h2 { font-size: 40px; line-height: 1.3; font-weight: 900; }
    .feature p { font-size: 19px; color: var(--ink-2); margin: 0 0 26px; max-width: 30em; }
    .points { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    .points li { display: flex; align-items: flex-start; gap: 14px; font-size: 16px; }
    .points .ic { flex: 0 0 36px; height: 36px; border-radius: 12px; background: var(--accent-tint); display: grid; place-items: center; }
    .points .ic svg { width: 19px; height: 19px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .points span { padding-top: 6px; }
    .visual { position: relative; height: 600px; }
    .visual::before { content: ""; position: absolute; inset: 8% 4%; border-radius: 48px; background: var(--warm); z-index: 0; }
    .visual .phone { position: absolute; z-index: 2; }
    .visual.two .p1 { left: 6%; top: 50%; transform: translateY(-54%) rotate(-3deg); width: 260px; }
    .visual.two .p2 { right: 6%; top: 50%; transform: translateY(-44%) rotate(3deg); width: 260px; z-index: 3; }
    .visual.solo .phone { left: 50%; top: 50%; transform: translate(-72%, -50%); width: 290px; }
    .visual.solo .dish { width: 290px; height: 290px; right: 0; top: 90px; z-index: 1; transform: rotate(6deg); }

    /* Bands */
    .band { padding: 110px 0; background: var(--warm); overflow: hidden; }
    .band .head { text-align: center; max-width: 720px; margin: 0 auto 56px; }
    .band h2 { font-size: 52px; line-height: 1.08; font-weight: 800; margin: 14px 0 16px; }
    html[lang="ja"] .band h2 { font-size: 40px; line-height: 1.3; font-weight: 900; }
    .band .head p { font-size: 19px; color: var(--ink-2); margin: 0; }
    .ipad { max-width: 860px; margin: 0 auto; border-radius: 40px; padding: 16px; background: linear-gradient(145deg, #2a2a2a, #0c0c0c); box-shadow: var(--shadow-lg); }
    .ipad img { width: 100%; height: auto; border-radius: 26px; }
    .ipad-frame { aspect-ratio: 2064 / 1376; overflow: hidden; border-radius: 26px; background: var(--subtle); }
    .ipad-frame img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 0; }
    .langs { display: flex; justify-content: center; gap: 36px; }
    .langs figure { margin: 0; text-align: center; }
    .langs figcaption { margin-top: 18px; font-weight: 600; color: var(--ink-2); }
    .langs .phone { width: 270px; }
    .langs figure:nth-child(1) .phone { transform: rotate(-2.5deg); }
    .langs figure:nth-child(2) .phone { transform: rotate(2.5deg); margin-top: 40px; }

    /* Premium (dark) */
    .premium { background: var(--dark); color: #F4F4F4; padding: 120px 0; overflow: hidden; }
    .premium .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 64px; align-items: center; }
    .premium h2 { font-size: 56px; line-height: 1.05; font-weight: 800; margin: 14px 0 20px; white-space: pre-line; }
    html[lang="ja"] .premium h2 { font-size: 42px; line-height: 1.3; font-weight: 900; }
    .premium p.lead { color: #B0B0B0; font-size: 19px; margin: 0 0 36px; }
    .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .plan { border-radius: 26px; padding: 28px; background: var(--dark-2); border: 1px solid #2C2C2C; }
    .plan.hi { background: linear-gradient(160deg, #2a1c18, #1E1E1E 60%); border-color: rgba(240,103,74,.45); }
    .plan h3 { margin: 0 0 4px; font-size: 22px; }
    .plan.hi h3 { color: var(--accent); }
    .plan .price { color: #B0B0B0; font-size: 15px; margin-bottom: 18px; }
    .plan ul { margin: 0; padding-left: 18px; color: #D0D0D0; font-size: 15px; }
    .plan li { margin-bottom: 7px; }
    .premium .phone { margin: 0 auto; width: 290px; transform: rotate(3deg); box-shadow: 0 40px 80px -20px rgba(240,103,74,.25), 0 20px 50px rgba(0,0,0,.6); }

    /* CTA + footer */
    .cta { text-align: center; padding: 110px 24px 120px; background: radial-gradient(900px 400px at 50% 0%, #FDEDE7, rgba(253,237,231,0) 70%); }
    .cta img.icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: var(--shadow-md); margin: 0 auto 26px; }
    .cta h2 { font-size: 48px; font-weight: 800; margin-bottom: 14px; }
    html[lang="ja"] .cta h2 { font-size: 36px; font-weight: 900; }
    .cta p { color: var(--ink-2); font-size: 19px; margin: 0 0 30px; }
    footer { border-top: 1px solid var(--line); padding: 30px 24px; font-size: 14px; color: var(--ink-2); }
    footer .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    footer nav { margin-left: auto; display: flex; gap: 22px; }

    /* Scroll reveal */
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s ease; }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .marquee .track, .pill::before { animation: none; }
    }

    @media (max-width: 920px) {
      header nav { display: none; }
      .lang { margin-left: auto; }
      .hero .wrap, .feature, .premium .wrap { grid-template-columns: 1fr; gap: 48px; }
      .hero .wrap { min-height: 0; padding-top: 56px; }
      .hero h1 { font-size: 46px; }
      html[lang="ja"] .hero h1 { font-size: 36px; }
      .hero-visual { height: 600px; }
      .hero-visual .phone { width: 250px; }
      .hero-visual .d1 { width: 170px; height: 170px; left: 0; top: 40px; }
      .hero-visual .d2 { width: 160px; height: 160px; right: 0; bottom: 40px; }
      .feature { padding: 64px 24px; }
      .feature.flip .copy { order: 0; }
      .feature h2, .band h2 { font-size: 36px; }
      html[lang="ja"] .feature h2, html[lang="ja"] .band h2 { font-size: 28px; }
      .premium h2 { font-size: 38px; }
      html[lang="ja"] .premium h2 { font-size: 30px; }
      .visual { height: 520px; }
      .visual.two .p1, .visual.two .p2 { width: 200px; }
      .visual.two .p1 { left: 2%; } .visual.two .p2 { right: 2%; }
      .visual.solo .phone { width: 230px; transform: translate(-70%, -50%); }
      .visual.solo .dish { width: 190px; height: 190px; top: 70px; }
      .langs { gap: 16px; }
      .langs .phone { width: 45vw; max-width: 240px; }
      .plans { grid-template-columns: 1fr; }
      .cta h2 { font-size: 34px; }
    }
    @media (max-width: 420px) {
      .visual.two .p1, .visual.two .p2 { width: 170px; }
      .visual { height: 440px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="#top"><img src="icon.png" alt="" /><span data-i18n="name"></span></a>
      <nav>
        <a href="#scan" data-i18n="nav.features"></a>
        <a href="#ipad" data-i18n="nav.devices"></a>
        <a href="#premium" data-i18n="nav.pricing"></a>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">日本語</button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <div class="wrap">
        <div class="reveal">
          <span class="pill" data-i18n="hero.badge"></span>
          <h1 data-i18n="hero.title"></h1>
          <p class="sub" data-i18n="hero.sub"></p>
          <span class="store" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.6-1-2.6-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 .1-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
            <span data-i18n="hero.store"></span>
          </span>
          <div class="note" data-i18n="hero.note"></div>
        </div>
        <div class="hero-visual reveal">
          <div class="dish d1"><img data-dish="hero1" alt="" /></div>
          <div class="phone"><img data-shot="01_library" alt="" width="529" height="1150" /></div>
          <div class="dish d2"><img data-dish="hero2" alt="" /></div>
        </div>
      </div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

    <div class="features">
      <!-- Scan -->
      <section class="wrap feature" id="scan">
        <div class="copy reveal">
          <div class="kicker" data-i18n="scan.k"></div>
          <h2 data-i18n="scan.t"></h2>
          <p data-i18n="scan.p"></p>
          <ul class="points">
            <li><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></div><span data-i18n="scan.1"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M8 4h8a2 2 0 012 2v12a2 2 0 01-2 2H8"/><path d="M4 8h8a2 2 0 012 2v10H6a2 2 0 01-2-2z"/></svg></div><span data-i18n="scan.2"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div><span data-i18n="scan.3"></span></li>
          </ul>
        </div>
        <div class="visual two reveal">
          <div class="phone p1"><img data-shot="02_scan_pages" alt="" loading="lazy" width="529" height="1150" /></div>
          <div class="phone p2"><img data-shot="03_scan_result" alt="" loading="lazy" width="529" height="1150" /></div>
        </div>
      </section>

      <!-- Servings -->
      <section class="wrap feature flip" id="servings">
        <div class="copy reveal">
          <div class="kicker" data-i18n="serv.k"></div>
          <h2 data-i18n="serv.t"></h2>
          <p data-i18n="serv.p"></p>
          <ul class="points">
            <li><div class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5A5 5 0 0121 19"/></svg></div><span data-i18n="serv.1"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></div><span data-i18n="serv.2"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg></div><span data-i18n="serv.3"></span></li>
          </ul>
        </div>
        <div class="visual solo reveal">
          <div class="phone"><img data-shot="04_servings" alt="" loading="lazy" width="529" height="1150" /></div>
          <div class="dish"><img data-dish="serv" alt="" loading="lazy" /></div>
        </div>
      </section>

      <!-- Units -->
      <section class="wrap feature" id="units">
        <div class="copy reveal">
          <div class="kicker" data-i18n="units.k"></div>
          <h2 data-i18n="units.t"></h2>
          <p data-i18n="units.p"></p>
          <ul class="points">
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h12l-1 18H7z"/><path d="M6.5 9h11"/></svg></div><span data-i18n="units.1"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5M12 17h.01"/></svg></div><span data-i18n="units.2"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg></div><span data-i18n="units.3"></span></li>
          </ul>
        </div>
        <div class="visual two reveal">
          <div class="phone p1"><img data-shot="05_units" alt="" loading="lazy" width="529" height="1150" /></div>
          <div class="phone p2"><img data-shot="06_converter" alt="" loading="lazy" width="529" height="1150" /></div>
        </div>
      </section>

      <!-- Timers -->
      <section class="wrap feature flip" id="timers">
        <div class="copy reveal">
          <div class="kicker" data-i18n="timers.k"></div>
          <h2 data-i18n="timers.t"></h2>
          <p data-i18n="timers.p"></p>
          <ul class="points">
            <li><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></div><span data-i18n="timers.1"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg></div><span data-i18n="timers.2"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1015.5-6.2L21 3v6h-6"/></svg></div><span data-i18n="timers.3"></span></li>
          </ul>
        </div>
        <div class="visual two reveal">
          <div class="phone p1"><img data-shot="07_timers" alt="" loading="lazy" width="529" height="1150" /></div>
          <div class="phone p2"><img data-shot="07b_timers_list" alt="" loading="lazy" width="529" height="1150" /></div>
        </div>
      </section>

      <!-- Shopping -->
      <section class="wrap feature" id="shopping">
        <div class="copy reveal">
          <div class="kicker" data-i18n="shop.k"></div>
          <h2 data-i18n="shop.t"></h2>
          <p data-i18n="shop.p"></p>
          <ul class="points">
            <li><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10l2 2 4-4M8 16h8"/></svg></div><span data-i18n="shop.1"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 13v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg></div><span data-i18n="shop.2"></span></li>
            <li><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div><span data-i18n="shop.3"></span></li>
          </ul>
        </div>
        <div class="visual solo reveal">
          <div class="phone"><img data-shot="08_shopping_list" alt="" loading="lazy" width="529" height="1150" /></div>
          <div class="dish"><img data-dish="shop" alt="" loading="lazy" /></div>
        </div>
      </section>

      <!-- Organise -->
      <section class="wrap feature flip" id="organise">

    };

    function apply(lang) {
      var t = I18N[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var v = t[el.getAttribute("data-i18n")];
        if (v == null) return;
        if (v.indexOf("<") >= 0) el.innerHTML = v; else el.textContent = v;
      });
      document.querySelectorAll("img[data-shot]").forEach(function (img) {
        var s = img.getAttribute("data-shot");
        img.src = "assets/screens/" + lang + "/" + s + ".jpg";
        img.alt = ALT[lang][s] || "";
      });
      document.querySelectorAll("img[data-dish]").forEach(function (img) {
        img.src = "assets/dishes/" + DISH[lang][img.getAttribute("data-dish")] + ".jpg";
      });
      document.querySelectorAll(".lang button").forEach(function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
      });
      document.title = lang === "ja" ? "レシピチューン：どのレシピも、すぐ作れる" : "RecipeTune: your recipes, ready to cook";
      try { localStorage.setItem("rt-lang", lang); } catch (e) {}
    }

    function initial() {
      if (location.pathname.indexOf("/jp") === 0) return "ja";
      if (location.pathname.indexOf("/en") === 0) return "en";
      try { var s = localStorage.getItem("rt-lang"); if (s === "en" || s === "ja") return s; } catch (e) {}
      return (navigator.language || "").toLowerCase().indexOf("ja") === 0 ? "ja" : "en";
    }

    // The dish strip: two copies back to back, so the loop is seamless.
    var track = document.getElementById("marquee");
    MARQUEE.concat(MARQUEE).forEach(function (d) {
      var img = document.createElement("img");
      img.src = "assets/dishes/" + d + ".jpg"; img.alt = ""; img.loading = "lazy";
      track.appendChild(img);
    });

    // Fade sections in as they arrive.
    var io = "IntersectionObserver" in window ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12 }) : null;
    document.querySelectorAll(".reveal").forEach(function (el) { io ? io.observe(el) : el.classList.add("in"); });

    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { apply(b.getAttribute("data-lang")); });
    });
    apply(initial());
